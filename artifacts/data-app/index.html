<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f3ee" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e121b" media="(prefers-color-scheme: dark)" />
    <title>Paris &amp; Suburbs Property Sales</title>
    <meta name="description" content="Prix au m² des ventes de logements et leur évolution, par quartier et commune, d&#39;après DVF. · Price per m² of home sales and how it changed, by quartier and commune, from DVF." />
    <meta name="robots" content="noindex, nofollow" />
    <meta property="og:title" content="Ventes immobilières à Paris et alentours · Paris &amp; Suburbs Property Sales" />
    <meta property="og:description" content="Prix au m² des ventes de logements et leur évolution, par quartier et commune, d&#39;après DVF. · Price per m² of home sales and how it changed, by quartier and commune, from DVF." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Ventes immobilières à Paris et alentours" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:locale:alternate" content="en_GB" />
    <!-- The server adds og:url, og:image and twitter:image with the absolute address from SITE_URL (api-server lib/pageMeta.ts). -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Ventes immobilières à Paris et alentours · Paris &amp; Suburbs Property Sales" />
    <meta name="twitter:description" content="Prix au m² des ventes de logements et leur évolution, par quartier et commune, d&#39;après DVF. · Price per m² of home sales and how it changed, by quartier and commune, from DVF." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Before the first paint: the theme (the Visitor's saved choice, else the system setting, see src/hooks/use-theme.ts)
         and the language (the saved choice, else French for a French browser, see pickLang in src/lib/i18n/language.ts). -->
    <script>
      try {
        var l = (navigator.languages && navigator.languages[0]) || navigator.language || "";
        document.documentElement.lang = /^fr/i.test(l) ? "fr" : "en";
        var s = localStorage.getItem("lang");
        if (s === "en" || s === "fr") document.documentElement.lang = s;
        var t = localStorage.getItem("theme");
        if (t === "dark" || (t !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches)) document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
  </head>
  <body>
    <!-- Shown until the app draws, in place of a blank page on a slow connection. React replaces it. -->
    <style>
      .boot { min-height: 100dvh; margin: 0; display: flex; align-items: center; justify-content: center; font: 16px system-ui, sans-serif; color: #6b6660; }
      html.dark .boot { color: #a3a8b3; background: #0e121b; }
      html[lang="fr"] .boot-en, html:not([lang="fr"]) .boot-fr { display: none; }
    </style>
    <div id="root"><p class="boot" role="status"><span class="boot-en">Loading the sales data…</span><span class="boot-fr">Chargement des données des ventes…</span></p></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
