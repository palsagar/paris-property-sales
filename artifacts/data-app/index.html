<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f3ee" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e121b" media="(prefers-color-scheme: dark)" />
    <title>Paris &amp; Suburbs Property Sales</title>
    <meta name="description" content="Private residential property sales in Paris and its suburbs: prices, price per m2 and how they evolved by quartier and commune." />
    <meta name="robots" content="index, follow" />
    <meta property="og:title" content="Paris &amp; Suburbs Property Sales" />
    <meta property="og:description" content="Private residential property sales in Paris and its suburbs: prices, price per m2 and how they evolved by quartier and commune." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Paris &amp; Suburbs Property Sales" />
    <meta name="twitter:description" content="Private residential property sales in Paris and its suburbs: prices, price per m2 and how they evolved by quartier and commune." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Before the first paint: the theme (the Visitor's saved choice, else the system setting, see src/hooks/use-theme.ts)
         and the language (the saved choice, else French for a French browser, see pickLang in src/lib/i18n/language.ts). -->
    <script>
      try {
        var l = (navigator.languages && navigator.languages[0]) || navigator.language || "";
        document.documentElement.lang = /^fr/i.test(l) ? "fr" : "en";
        var s = localStorage.getItem("lang");
        if (s === "en" || s === "fr") document.documentElement.lang = s;
        var t = localStorage.getItem("theme");
        if (t === "dark" || (t !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches)) document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
